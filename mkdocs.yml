site_name: MODIHUB
site_description: Async unified interface for multiple LLM providers.
repo_url: https://github.com/haruiz/modihub
docs_dir: mkdocs
site_dir: docs
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.instant
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Provider Clients: providers.md
  - Evaluation: evaluation.md
  - API Reference: api-reference.md
  - Development: development.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
